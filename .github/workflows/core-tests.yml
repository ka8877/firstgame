name: Deterministic core and saves
on:
  push:
    branches-ignore:
      - gh-pages
      # This fixed coordination ref has the unchanged main tree, no game changes.
      - codex/autonomy-lock
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.426
      - name: Test development lease ownership and failure handling
        run: python3 -m unittest discover -s Tools/Autonomy -p test_cycle_guard.py -v
      - name: Test strict public reload audio evidence
        run: python3 -m unittest discover -s Tools/Validation -p test_fm_public_reload_ranges.py -v
      - name: Test actual C# game rules, Ink and portable saves
        run: bash Tools/Validation/run-core-tests.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-test-results
          path: Artifacts/TestResults/Core/*.trx
