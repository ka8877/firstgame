<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>{{{ PRODUCT_NAME }}}</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://w.soundcloud.com">
  <link rel="preconnect" href="https://api-v2.soundcloud.com">
  <link rel="preconnect" href="https://cf-media.sndcdn.com">
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; background: #080d14; }
    body { display: grid; grid-template-rows: 1fr 44px; place-items: center; }
    #unity-container { position: relative; width: min(100vw, calc(177.777778vh - 78.222222px)); height: min(calc(100vh - 44px), 56.25vw); background: #181712; }
    #unity-canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; -webkit-user-select: none; user-select: none; }
    #unity-loading-bar { position: absolute; inset: 0; display: grid; place-content: center; gap: 20px; padding: 24px; text-align: center; background: radial-gradient(ellipse at 50% 20%, #353859, #11182b 70%); }
    #unity-loading-bar h1 { margin: 0; color: #e7cb88; font-weight: 500; font-size: clamp(20px, 3vw, 40px); }
    #unity-loading-bar p { margin: 0; color: #c9d7df; }
    progress { width: min(340px, 70vw); height: 8px; accent-color: #d6b86f; margin: auto; }
    #unity-warning { position: absolute; top: 14px; left: 5%; right: 5%; z-index: 3; display: grid; gap: 8px; }
    #unity-warning:empty { display: none; }
    .warning { padding: 12px 18px; background: #443720; color: #fff0cb; border-radius: 6px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px; }
    .warning.error { background: #4f202b; color: #fff; }
    #orientation-guide { display: none; position: fixed; inset: 0; z-index: 10; padding: max(28px, env(safe-area-inset-top)) 28px; background: #0b121ef2; color: #f4eedf; text-align: center; align-content: center; justify-items: center; gap: 20px; }
    #orientation-guide h2 { margin: 0; font-size: 28px; font-weight: 500; }
    #orientation-guide p { max-width: 30ch; line-height: 1.8; color: #b9c6ca; margin: 0; }
    #orientation-guide button { min-height: 48px; border: 1px solid #bba36e; border-radius: 24px; background: #e5d2a5; color: #142027; padding: 12px 24px; font: inherit; cursor: pointer; }
    #orientation-guide .secondary { background: transparent; color: #e5d2a5; border-color: #58606a; }
    @media (pointer: coarse) and (orientation: portrait) { #orientation-guide:not([hidden]) { display: grid; } }
    #fm-music { width: 100%; height: 44px; display: flex; align-items: center; justify-content: center; gap: 12px; padding: 4px 12px; color: #dbca9b; background: #171612; border-top: 1px solid #776144; font-size: 12px; }
    #fm-music button, #fm-music summary { cursor: pointer; font: inherit; color: inherit; }
    #fm-music button { border: 1px solid #8d754b; border-radius: 3px; padding: 6px 10px; background: #383025; }
    #fm-music details { position: relative; }
    #fm-music iframe { position: absolute; bottom: 32px; right: 0; width: min(350px, 92vw); height: 166px; border: 1px solid #8d754b; background: #eee; z-index: 8; }
    #fm-music details:not([open]) iframe, #fm-music iframe:not(.fm-current-player) { visibility: hidden; pointer-events: none; }
    #fm-loading-start { margin: auto; padding: 12px 24px; border: 1px solid #bba36e; border-radius: 6px; background: #e5d2a5; color: #142027; font: inherit; cursor: pointer; }
    #fm-music a { color: #d2be8d; }
    @media (max-width: 600px) { #fm-music { gap: 6px; font-size: 10px; padding: 3px; } #fm-music-credit { display: none; } }
    @supports (height: 100dvh) { #unity-container { width: min(100vw, calc(177.777778dvh - 78.222222px)); height: min(calc(100dvh - 44px), 56.25vw); } }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main id="unity-container" aria-label="{{{ PRODUCT_NAME }}}">
    <canvas id="unity-canvas" width="{{{ WIDTH }}}" height="{{{ HEIGHT }}}" tabindex="0" aria-label="{{{ PRODUCT_NAME }}} 게임 화면" data-unity-state="loading"></canvas>
    <div id="unity-loading-bar" role="status" aria-live="polite">
      <h1>{{{ PRODUCT_NAME }}}</h1>
      <p id="loading-label">판타지마스터즈를 준비하고 있습니다…</p>
      <progress id="unity-progress" max="1" value="0" aria-label="게임 불러오기"></progress>
      <button id="fm-loading-start" type="button">시작 · 원작 BGM 듣기</button>
      <p style="font-size:12px;opacity:.75">첫 화면 조작으로 SOUND-I의 공식 음악을 시작합니다.</p>
    </div>
    <div id="unity-warning" role="alert" aria-live="assertive"></div>
  </main>
  <footer id="fm-music" aria-label="판타지마스터즈 원작 음악">
    <button id="fm-music-toggle" type="button">원작 BGM 시작</button>
    <span id="fm-music-status" role="status">로그인 · SOUND-I</span>
    <details id="fm-player-panel"><summary>공식 플레이어</summary>
      <iframe id="fm-original-player" class="fm-current-player" title="SOUND-I 판타지마스터즈 공식 음악 · 로그인" allow="autoplay" loading="eager" src="https://w.soundcloud.com/player/?url=https%3A%2F%2Fapi.soundcloud.com%2Ftracks%2F234910360&amp;auto_play=false&amp;single_active=false&amp;show_artwork=false&amp;visual=false"></iframe>
      <iframe id="fm-original-player-lobby" title="SOUND-I 판타지마스터즈 공식 음악 · 로비" allow="autoplay" loading="eager" src="https://w.soundcloud.com/player/?url=https%3A%2F%2Fapi.soundcloud.com%2Ftracks%2F234910359&amp;auto_play=false&amp;single_active=false&amp;show_artwork=false&amp;visual=false"></iframe>
      <iframe id="fm-original-player-deck" title="SOUND-I 판타지마스터즈 공식 음악 · 덱 편집" allow="autoplay" loading="eager" src="https://w.soundcloud.com/player/?url=https%3A%2F%2Fapi.soundcloud.com%2Ftracks%2F234910362&amp;auto_play=false&amp;single_active=false&amp;show_artwork=false&amp;visual=false"></iframe>
      <iframe id="fm-original-player-battle" title="SOUND-I 판타지마스터즈 공식 음악 · 게임 1" allow="autoplay" loading="eager" src="https://w.soundcloud.com/player/?url=https%3A%2F%2Fapi.soundcloud.com%2Ftracks%2F234910353&amp;auto_play=false&amp;single_active=false&amp;show_artwork=false&amp;visual=false"></iframe>
    </details>
    <a id="fm-music-credit" href="https://soundcloud.com/sound-i2/sets/eomgh4mkqbec" target="_blank" rel="noopener noreferrer">SOUND-I 원곡</a>
  </footer>
  <script id="fm-original-music-controller">
    (function () {
      "use strict";
      // Keep each official embed alive. Scene changes never reload a track or
      // fetch/repackage the composer's audio outside the hosted player.
      var tracks = {
        login: { id: 234910360, label: "로그인", frameId: "fm-original-player" },
        lobby: { id: 234910359, label: "로비", frameId: "fm-original-player-lobby" },
        deck: { id: 234910362, label: "덱 편집", frameId: "fm-original-player-deck" },
        battle: { id: 234910353, label: "게임 1", frameId: "fm-original-player-battle" }
      };
      var button = document.getElementById("fm-music-toggle");
      var status = document.getElementById("fm-music-status");
      var panel = document.getElementById("fm-player-panel");
      var scene = "login", active = null, generation = 0;
      var muted = false, volume = .6, hasMutedPreference = false, hasVolumePreference = false;
      var requestAt = performance.now();
      function readPreference(key) {
        try { return window.localStorage.getItem("FC.originalMusic." + key); } catch (_) { return null; }
      }
      function savePreference(key, value) {
        try { window.localStorage.setItem("FC.originalMusic." + key, String(value)); } catch (_) { /* Private storage can be unavailable. */ }
      }
      var storedMuted = readPreference("muted"), storedVolume = readPreference("volume");
      if (storedMuted !== null) { muted = storedMuted === "1"; hasMutedPreference = true; }
      if (storedVolume !== null && Number.isFinite(Number(storedVolume))) {
        volume = Math.max(0, Math.min(1, Number(storedVolume))); hasVolumePreference = true;
      }
      Object.keys(tracks).forEach(function (key) {
        var player = tracks[key];
        player.scene = key;
        player.frame = document.getElementById(player.frameId);
        player.widget = null;
        player.ready = false;
        player.playing = false;
        player.pending = false;
        player.warming = false;
        player.warmed = false;
        player.playEpoch = 0;
        player.playEventAt = 0;
      });
      function render() {
        var suffix = muted ? "SOUND-I 음소거" : active && active.playing
          ? (active === tracks[scene] ? "SOUND-I 재생 중" : "SOUND-I 전환 중")
          : tracks[scene].ready ? "화면을 조작하면 음악 재생" : "공식 플레이어 준비 중";
        status.textContent = tracks[scene].label + " · " + suffix;
        button.textContent = muted ? "원작 BGM 켜기" : active && active.playing ? "원작 BGM 끄기" : "원작 BGM 시작";
        button.setAttribute("aria-pressed", String(!muted));
        status.dataset.muted = String(muted);
        status.dataset.volume = String(volume);
      }
      function markRequest() {
        requestAt = performance.now();
        status.dataset.requestedScene = scene;
        status.dataset.requestedTrackId = String(tracks[scene].id);
        status.dataset.requestedAtMs = String(requestAt);
        Object.keys(tracks).forEach(function (key) {
          var selected = key === scene;
          tracks[key].frame.classList.toggle("fm-current-player", selected);
          tracks[key].frame.setAttribute("aria-hidden", String(!selected));
          tracks[key].frame.tabIndex = selected ? 0 : -1;
        });
      }
      function pausePlayer(player, rewind) {
        // Do not wait for asynchronous PAUSE to clear this flag: immediate
        // reentry must send play(), including a warm-up pause still in flight.
        player.playing = false;
        player.pending = false;
        ++player.playEpoch;
        player.widget.setVolume(0);
        player.widget.pause();
        if (rewind) player.widget.seekTo(0);
      }
      function stopWarmup(player) {
        player.warmed = true;
        player.warming = false;
        if (player === active || (!muted && player === tracks[scene])) return;
        pausePlayer(player, true);
      }
      function confirmPlaying(player, version) {
        var epoch = player.playEpoch;
        player.widget.getCurrentSound(function (sound) {
          // A late reply from an earlier scene/player must never become audible
          // or rewrite the actual source/progress reported to QA.
          if (version !== generation || epoch !== player.playEpoch || !player.playing || muted || player !== tracks[scene]) return;
          if (!sound || String(sound.id) !== String(player.id)) {
            pausePlayer(player, false);
            status.dataset.playback = active && active.playing ? "playing" : "error";
            status.textContent = tracks[scene].label + " · 공식 플레이어에서 곡 확인";
            panel.open = true;
            return;
          }
          var previous = active;
          active = player;
          player.warming = false;
          player.warmed = true;
          player.widget.setVolume(volume * 100);
          if (previous && previous !== player) {
            pausePlayer(previous, false);
          }
          // These identity fields come only from the actual widget response.
          status.dataset.trackId = String(sound.id);
          status.dataset.trackTitle = String(sound.title || "");
          status.dataset.publisher = sound.user ? String(sound.user.username || "") : "";
          status.dataset.playback = "playing";
          delete status.dataset.positionMs;
          status.dataset.playEventAtMs = String(player.playEventAt);
          status.dataset.playAtMs = String(performance.now());
          status.dataset.latencyMs = String(Math.max(0, performance.now() - requestAt));
          player.widget.getPosition(function (position) {
            if (version === generation && active === player && player.playing && epoch === player.playEpoch) {
              status.dataset.positionMs = String(Math.round(position || 0));
            }
          });
          render();
        });
      }
      function requestTarget(retry) {
        var player = tracks[scene];
        if (muted || !player.ready) { render(); return; }
        if (player.playing) {
          if (active === player) player.widget.setVolume(volume * 100);
          else confirmPlaying(player, generation);
        } else if (!player.pending || retry) {
          // An initial audible attempt obeys browser autoplay policy. During a
          // handover the incoming player stays silent until its actual PLAY.
          player.widget.setVolume(active ? 0 : volume * 100);
          player.pending = true;
          player.widget.play();
        }
        render();
      }
      function warmPlayers(retry) {
        Object.keys(tracks).forEach(function (key) {
          var player = tracks[key];
          if (!player.ready || player.warmed || player === active || (!muted && player === tracks[scene])) return;
          if (player.playing || (player.pending && !retry)) return;
          player.warming = true;
          player.pending = true;
          player.widget.setVolume(0);
          player.widget.play();
        });
      }
      function setMuted(value) {
        muted = value === true;
        hasMutedPreference = true;
        savePreference("muted", muted ? 1 : 0);
        if (muted) {
          ++generation;
          Object.keys(tracks).forEach(function (key) {
            var player = tracks[key];
            if (!player.ready) return;
            pausePlayer(player, false);
          });
          active = null;
          status.dataset.playback = "paused";
        } else requestTarget(true);
        render();
      }
      function setVolume(value) {
        if (!Number.isFinite(value)) return;
        volume = Math.max(0, Math.min(1, value));
        hasVolumePreference = true;
        savePreference("volume", volume);
        if (active && active.ready) active.widget.setVolume(muted ? 0 : volume * 100);
        else if (!muted && tracks[scene].ready && !tracks[scene].warming) tracks[scene].widget.setVolume(volume * 100);
        render();
      }
      function setScene(value) {
        if (!tracks[value] || scene === value) { requestTarget(false); return; }
        scene = value;
        ++generation;
        markRequest();
        Object.keys(tracks).forEach(function (key) {
          var player = tracks[key];
          if (player.ready && player.playing && player !== active && player !== tracks[scene] && !player.warming) pausePlayer(player, false);
        });
        // Keep the outgoing track until the incoming official player confirms
        // PLAY. A rapid second scene change invalidates every prior callback.
        requestTarget(false);
        warmPlayers(false);
      }
      window.FirstGameOriginalMusic = {
        receive: function (message) {
          if (!message) return;
          // A scene notification carries no authority to reset footer settings.
          if (!message.change || message.change === "muted") {
            if (typeof message.muted === "boolean") setMuted(message.muted);
          }
          if (!message.change || message.change === "volume") setVolume(message.volume);
          if (!message.change || message.change === "scene") setScene(message.scene);
        },
        getState: function () {
          return { muted: muted, volume: volume, hasMutedPreference: hasMutedPreference, hasVolumePreference: hasVolumePreference };
        },
        getDiagnostics: function () {
          return Object.keys(tracks).map(function (key) {
            var player = tracks[key];
            return { scene: key, ready: player.ready, warmed: player.warmed, playing: player.playing, active: player === active };
          });
        }
      };
      (window.__fmOriginalMusicMessages || []).forEach(window.FirstGameOriginalMusic.receive);
      window.__fmOriginalMusicMessages = [];
      button.addEventListener("click", function () {
        if (muted || !active || !active.playing) {
          setMuted(false); warmPlayers(true);
        } else setMuted(true);
      });
      function startFromPageGesture(event) {
        if (!event.isTrusted) return;
        // The toggle's own click handler has an explicit start/mute action.
        if (event.target && event.target.closest && event.target.closest("#fm-music-toggle")) return;
        requestTarget(true);
        warmPlayers(true);
      }
      // Listen across the whole page, including loading/orientation buttons.
      // Touch browsers may activate on pointerup rather than pointerdown.
      ["pointerdown", "pointerup", "touchend", "keydown"].forEach(function (type) {
        document.addEventListener(type, startFromPageGesture, true);
      });
      document.getElementById("fm-loading-start").addEventListener("click", function () {
        requestTarget(true); warmPlayers(true);
        this.textContent = "게임을 불러오는 동안 음악을 준비합니다…";
      });
      status.dataset.playback = "loading";
      markRequest();
      render();
      var api = document.createElement("script");
      api.src = "https://w.soundcloud.com/player/api.js";
      api.onerror = function () {
        status.dataset.playback = "error";
        status.textContent = tracks[scene].label + " · 연결 확인 · 공식 플레이어에서 재생";
        panel.open = true;
      };
      api.onload = function () {
        Object.keys(tracks).forEach(function (key) {
          var player = tracks[key];
          player.widget = SC.Widget(player.frame);
          player.widget.bind(SC.Widget.Events.READY, function () {
            player.ready = true;
            requestTarget(false);
            warmPlayers(false);
          });
          player.widget.bind(SC.Widget.Events.PLAY, function () {
            player.playing = true;
            player.pending = false;
            ++player.playEpoch;
            player.playEventAt = performance.now();
            if (!muted && player === tracks[scene]) confirmPlaying(player, generation);
            else if (player !== active) {
              player.widget.setVolume(0);
              // A delayed PLAY from a cancelled request must stop, while a
              // deliberate silent warm-up may finish its first real progress.
              if (!player.warming) pausePlayer(player, false);
            }
          });
          player.widget.bind(SC.Widget.Events.PLAY_PROGRESS, function (event) {
            if (player.warming && event.currentPosition > 0) stopWarmup(player);
            if (active === player && player.playing) status.dataset.positionMs = String(Math.round(event.currentPosition || 0));
          });
          player.widget.bind(SC.Widget.Events.PAUSE, function () {
            player.playing = false;
            player.pending = false;
            ++player.playEpoch;
            if (active === player) {
              active = null;
              status.dataset.playback = "paused";
              render();
            }
          });
          player.widget.bind(SC.Widget.Events.FINISH, function () {
            player.playing = false;
            player.pending = false;
            ++player.playEpoch;
            if (!muted && (player === active || player === tracks[scene])) {
              player.widget.seekTo(0); player.widget.play();
            } else if (player.warming) stopWarmup(player);
          });
          if (SC.Widget.Events.ERROR) player.widget.bind(SC.Widget.Events.ERROR, function () {
            player.pending = false;
            if (player !== tracks[scene]) return;
            status.textContent = tracks[scene].label + " · 연결 확인 · 공식 플레이어에서 재생";
            if (!active) status.dataset.playback = "error";
            panel.open = true;
          });
        });
      };
      document.body.appendChild(api);
    }());
  </script>
  <aside id="orientation-guide" aria-label="모바일 화면 안내">
    <span aria-hidden="true" style="font-size:48px">↻</span>
    <h2>가로로 펼쳐지는 이야기</h2>
    <p>휴대폰을 가로로 돌리면 그림과 대사를 더 크게 볼 수 있습니다.</p>
    <button id="landscape-start" type="button">전체화면으로 시작</button>
    <button id="portrait-start" class="secondary" type="button">현재 화면에서 시작</button>
  </aside>
  <script>
    // Loader variables and createUnityInstance API follow Unity 6000.3's official Default template.
    // CSS fits the authored 16:9 composition to the viewport; Unity resizes the render target itself.
    var canvas = document.querySelector("#unity-canvas");
    var loading = document.querySelector("#unity-loading-bar");
    var warningBanner = document.querySelector("#unity-warning");
    function unityShowBanner(message, type) {
      var entry = document.createElement("div");
      entry.className = "warning" + (type === "error" ? " error" : "");
      entry.textContent = String(message);
      warningBanner.appendChild(entry);
      if (type === "error") {
        canvas.dataset.unityState = "error";
        loading.hidden = true;
      } else {
        window.setTimeout(function () { entry.remove(); }, 7000);
      }
    }
    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
    var config = {
      arguments: [],
      dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
      frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
      workerUrl: buildUrl + "/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
      codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
      symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
      streamingAssetsUrl: "StreamingAssets",
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      showBanner: unityShowBanner,
      matchWebGLToCanvasSize: true,
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, window.matchMedia("(pointer: coarse)").matches ? 1.25 : 2)
    };
#if BACKGROUND_FILENAME
    canvas.style.background = "url('" + buildUrl + "/{{{ BACKGROUND_FILENAME.replace(/'/g, '%27') }}}') center / cover";
#endif
    // This stable page path preserves browser save storage when build file hashes change.
    // Expose only the actual public asset URL for smoke checks; no game state is exposed.
    canvas.dataset.dataUrl = new URL(config.dataUrl, window.location.href).href;
    var orientationGuide = document.querySelector("#orientation-guide");
    document.querySelector("#portrait-start").addEventListener("click", function () {
      orientationGuide.hidden = true;
      canvas.focus();
    });
    document.querySelector("#landscape-start").addEventListener("click", async function () {
      orientationGuide.hidden = true;
      try {
        if (document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen();
        if (screen.orientation && screen.orientation.lock) await screen.orientation.lock("landscape");
      } catch (_) { /* Unsupported on some mobile browsers; physical rotation remains available. */ }
      canvas.focus();
    });
    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onerror = function () {
      unityShowBanner("게임 파일을 불러오지 못했습니다. 연결을 확인한 뒤 페이지를 다시 열어 주세요.", "error");
    };
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        document.querySelector("#unity-progress").value = progress;
        document.querySelector("#loading-label").textContent = "판타지마스터즈를 준비하고 있습니다… " + Math.round(progress * 100) + "%";
      }).then(function () {
        loading.hidden = true;
        if (canvas.dataset.unityState !== "error") canvas.dataset.unityState = "ready";
        canvas.focus();
      }).catch(function (message) {
        unityShowBanner("게임을 시작하지 못했습니다.\n" + String(message), "error");
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
